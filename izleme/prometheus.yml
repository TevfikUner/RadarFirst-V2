# P1-3: docker compose --profile izleme up -d prometheus  ->  http://127.0.0.1:9090 (Alerts sekmesi).
# Bildirim kanalı (Alertmanager) yok: alarmlar Prometheus arayüzünde görünür.
# /metrics yönetici anahtarı ister; anahtar .env'deki PROMETHEUS_ANAHTAR_DOSYASI'ndan Docker secret olarak gelir
# ve API_ANAHTARLARI'nda "prometheus:yonetici:<anahtar>" olarak tanımlıdır (docs/ISLETIM_KILAVUZU.md §9).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alarmlar.yml

scrape_configs:
  - job_name: turbulans_api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus_anahtari
    static_configs:
      - targets: ["api:8000"]
