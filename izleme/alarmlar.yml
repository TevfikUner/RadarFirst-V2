# Eşikler README "İzleme ve çevrimdışı kullanım" ve docs/PERFORMANS_RAPORU.md hedeflerinden (H5: rota p95 ≤ 5 sn).
groups:
  - name: turbulans
    rules:
      - alert: ApiErisilemiyor
        expr: up{job="turbulans_api"} == 0
        for: 2m
        labels: {onem: kritik}
        annotations:
          ozet: "API /metrics 2 dakikadır okunamıyor (servis kapalı ya da izleme anahtarı geçersiz)."
      - alert: SigmetBayat
        expr: turbulans_sigmet_yas_saniye > 1800
        for: 5m
        labels: {onem: kritik}
        annotations:
          ozet: "Son başarılı SIGMET çekimi 30 dakikadan eski; rota yanıtları SIGMET kısıtını eksik uygular."
      - alert: GorevKuyruguBirikiyor
        expr: turbulans_gorev_kuyrugu_en_eski_bekleme_saniye > 120
        for: 5m
        labels: {onem: uyari}
        annotations:
          ozet: "Kuyrukta 2 dakikadan uzun bekleyen görev var (worker kapalı ya da yetişemiyor)."
      - alert: RotaHesabiYavas
        expr: histogram_quantile(0.95, sum by (le) (rate(turbulans_rota_hesabi_suresi_saniye_bucket[10m]))) > 5
        for: 10m
        labels: {onem: uyari}
        annotations:
          ozet: "Rota hesabı p95 5 saniyeyi aşıyor (PERFORMANS_RAPORU H5)."
      - alert: HizSiniriReddiArtti
        expr: sum(increase(turbulans_hiz_siniri_reddi_total[10m])) > 50
        for: 0m
        labels: {onem: uyari}
        annotations:
          ozet: "Son 10 dakikada 50'den fazla 429; aynı NAT arkasındaki cihazlar sınıra takılıyor olabilir."
