[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turbulans-radar"
version = "1.0.0"
description = "ERA5/GFS + OpenSky + canlı SIGMET ile türbülans analizi ve A* rota optimizasyonu yapan karar destek sistemi"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
turbulans-analiz = "turbulans_radar.analiz.ucus_analizi:ana"
turbulans-toplu-analiz = "turbulans_radar.analiz.toplu_analiz:ana"
turbulans-sigmet = "turbulans_radar.veri.sigmet_saglayici:ana"
turbulans-backtest = "turbulans_radar.dogrulama.rota_backtest:ana"
turbulans-mcp = "turbulans_radar.cli.mcp_postgres_sunucusu:ana"
turbulans-openapi = "turbulans_radar.cli.openapi_disa_aktar:ana"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
# Bilinçli olarak dar bir kural seti: gerçek hataları (F: pyflakes -- kullanılmayan
# import/değişken, tanımsız isim vb.) ve temel stil sorunlarını (E/W: pycodestyle)
# yakalar. Docstring/tip-ipucu zorunluluğu gibi daha ağır kural setleri (D, ANN)
# bilinçli olarak açılmadı -- bu proje Türkçe, açıklayıcı docstring'lere zaten
# önem veriyor ama bunu bir linter kuralıyla zorunlu kılmak gereksiz sürtünme
# yaratır.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # satır uzunluğu: line-length zaten 120, bazı SQL/HTML şablon
             # string'leri bunu aşabiliyor -- otomatik hata yerine elle karar.
    "E402",  # Windows konsolunun Türkçe/özel karakterlerde çökmesini önlemek
             # için birçok CLI script'i BİLEREK `konsolu_utf8_yap()`'i diğer
             # importlardan (özellikle print() üretebilecek olanlardan) önce
             # çağırıyor (bkz. konsol_kurulumu.py) -- bu, importları dosya
             # başına taşımaktan daha önemli, kasıtlı bir tasarım kararı.
]

[tool.ruff.lint.isort]
known-first-party = ["turbulans_radar"]

[tool.coverage.run]
# Sadece proje kodu -- migrations/ (Alembic'in kendi ürettiği kod) ve
# tests/'in kendisi kapsam yüzdesine dahil edilmez (aksi halde "testin
# kendisi test edilmedi" gibi anlamsız bir eksiklik raporlanır).
source = ["src/turbulans_radar"]
omit = ["*/site-packages/*"]

[tool.coverage.report]
# Gerçek veri/servis gerektirip CI'da atlanan (skip) testlerin (PostgreSQL,
# .nc dosyası, Playwright) kapsamadığı satırlar İSTENEREK dışlanmaz --
# rapor, CI'nin GERÇEKTEN neyi çalıştırdığını dürüstçe yansıtsın diye.
precision = 1
skip_empty = true
