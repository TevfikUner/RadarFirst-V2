[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turbulans-radar"
version = "1.0.0"
description = "ERA5/GFS + OpenSky + canlı SIGMET ile türbülans analizi ve A* rota optimizasyonu yapan karar destek sistemi"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
turbulans-analiz = "turbulans_radar.analiz.ucus_analizi:ana"
turbulans-toplu-analiz = "turbulans_radar.analiz.toplu_analiz:ana"
turbulans-sigmet = "turbulans_radar.veri.sigmet_saglayici:ana"
turbulans-kisitli-saha = "turbulans_radar.veri.kisitli_saha_saglayici:ana"
turbulans-isci = "turbulans_radar.isci.gorev_iscisi:ana"
turbulans-statik = "turbulans_radar.cli.statik_indir:ana"
turbulans-backtest = "turbulans_radar.dogrulama.rota_backtest:ana"
turbulans-mcp = "turbulans_radar.cli.mcp_postgres_sunucusu:ana"
turbulans-openapi = "turbulans_radar.cli.openapi_disa_aktar:ana"
turbulans-ml = "turbulans_radar.ml.ml_otomatik_egitim:ana"
turbulans-ml-degerlendirme = "turbulans_radar.ml.degerlendirme:ana"
turbulans-edr-kalibrasyon = "turbulans_radar.ml.edr_kalibrasyonu:ana"
turbulans-demo = "turbulans_radar.cli.demo:ana"
turbulans-ml-depo = "turbulans_radar.ml.ozellik_deposu:ana"
turbulans-performans = "turbulans_radar.cli.performans_olcumu:ana"
turbulans-sanal-pirep = "turbulans_radar.dogrulama.sanal_pirep_dogrulama:ana"
turbulans-demo-ekranlari = "turbulans_radar.cli.demo_ekranlari:ana"
turbulans-ayirma = "turbulans_radar.dogrulama.ayirma_gostergesi:ana"
turbulans-aip-ats = "turbulans_radar.cli.aip_ats_agi:ana"
turbulans-aip-sahalar = "turbulans_radar.cli.aip_enr51:ana"
turbulans-madis = "turbulans_radar.ml.madis_hatti:ana"
turbulans-canli-adsb = "turbulans_radar.veri.canli_adsb:ana"
turbulans-anomali-tabani = "turbulans_radar.dogrulama.anomali_tabani:ana"
turbulans-edr-esleme = "turbulans_radar.fizik.edr_esleme:ana"
turbulans-gosterge-degerlendirme = "turbulans_radar.ml.gosterge_degerlendirme:ana"
turbulans-sonuc-paketi = "turbulans_radar.ml.sonuc_paketi:ana"
turbulans-ml-duyarlilik = "turbulans_radar.ml.duyarlilik_analizi:ana"
turbulans-ml-rf-deneyi = "turbulans_radar.ml.rf_deneyi:ana"
turbulans-ml-tip-analizi = "turbulans_radar.ml.tip_analizi:ana"
turbulans-sanal-pirep-duyarlilik = "turbulans_radar.analiz.dedektor_duyarliligi:ana"
turbulans-kimlik-kontrol = "turbulans_radar.cli.kimlik_kontrol:ana"
turbulans-ornek-ucus = "turbulans_radar.cli.ornek_ucus_bul:ana"
turbulans-veri-kontrol = "turbulans_radar.cli.veri_kontrol:ana"
turbulans-esik-esleme = "turbulans_radar.analiz.esik_esleme:ana"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] }, era5 = { file = ["requirements-era5.txt"] } }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turbulans_radar = ["veri/*.geojson", "fizik/*.json", "ml/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
# Bilinçli olarak dar bir kural seti: gerçek hataları (F: pyflakes -- kullanılmayan
# import/değişken, tanımsız isim vb.) ve temel stil sorunlarını (E/W: pycodestyle)
# yakalar. Docstring/tip-ipucu zorunluluğu gibi daha ağır kural setleri (D, ANN)
# bilinçli olarak açılmadı -- bu proje Türkçe, açıklayıcı docstring'lere zaten
# önem veriyor ama bunu bir linter kuralıyla zorunlu kılmak gereksiz sürtünme
# yaratır.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # satır uzunluğu: line-length zaten 120, bazı SQL/HTML şablon
             # string'leri bunu aşabiliyor -- otomatik hata yerine elle karar.
    "E402",  # Windows konsolunun Türkçe/özel karakterlerde çökmesini önlemek
             # için birçok CLI script'i BİLEREK `konsolu_utf8_yap()`'i diğer
             # importlardan (özellikle print() üretebilecek olanlardan) önce
             # çağırıyor (bkz. konsol_kurulumu.py) -- bu, importları dosya
             # başına taşımaktan daha önemli, kasıtlı bir tasarım kararı.
]

[tool.ruff.lint.isort]
known-first-party = ["turbulans_radar"]

[tool.coverage.run]
# Sadece proje kodu -- migrations/ (Alembic'in kendi ürettiği kod) ve
# tests/'in kendisi kapsam yüzdesine dahil edilmez (aksi halde "testin
# kendisi test edilmedi" gibi anlamsız bir eksiklik raporlanır).
source = ["src/turbulans_radar"]
omit = ["*/site-packages/*"]

[tool.coverage.report]
# Gerçek veri/servis gerektirip CI'da atlanan (skip) testlerin (PostgreSQL,
# .nc dosyası, Playwright) kapsamadığı satırlar İSTENEREK dışlanmaz --
# rapor, CI'nin GERÇEKTEN neyi çalıştırdığını dürüstçe yansıtsın diye.
precision = 1
skip_empty = true
