# ERA5 arşiv küpleri imaja girmez (.dockerignore: *.nc); proje kökü (ya da
# YEREL_VERI_KOKU) /veri'ye SALT OKUNUR bağlanır ve API ile işçi AYNI yollardan
# okur (katalogdaki dosya_yolu iki serviste de geçerli olsun diye). Dosya yoksa
# sadece o küp atlanır, yığın yine ayağa kalkar.
x-veri-ortami: &veri_ortami
  HAVA_DURUMU_DOSYASI: /veri/${HAVA_DURUMU_DOSYA_ADI:-ocak_2019_turbulans.nc}
  EK_HAVA_DURUMU_KLASORU: /veri/${EK_HAVA_DURUMU_KLASOR_ADI:-era5_egitim_verisi}
  MODEL_KLASORU: /app/model_deposu
  CDSAPI_RC: /run/secrets/cdsapirc

x-ortak-volumeler: &ortak_volumeler
  - ./ciktilar:/app/ciktilar
  - ./canli_veri:/app/canli_veri
  - ./era5_ucus_verisi:/app/era5_ucus_verisi
  - ./era5_arco_onbellek:/app/era5_arco_onbellek
  - ./opensky_onbellek:/app/opensky_onbellek
  - ${YEREL_VERI_KOKU:-.}:/veri:ro
  - turbulans_modeller:/app/model_deposu

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Turbulence-db}
    volumes:
      - turbulans_pgdata:/var/lib/postgresql/data
    ports:
      # Sadece bu makineden erişilebilir -- varsayılan şifreyle dış ağa açılmasın.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env'deki POSTGRES_HOST genelde 'localhost'tur (host makineden
      # doğrudan bağlanmak için) -- konteynerler arasında bu, compose'un
      # servis adı ('db') olmalı. env_file'dan SONRA geldiği için bu değer
      # üstün gelir.
      POSTGRES_HOST: db
      # Otonom backend: API, canlı AWC SIGMET'lerini kendi içinde periyodik yeniler.
      SIGMET_OTOMATIK_GUNCELLEME_DAKIKA: ${SIGMET_OTOMATIK_GUNCELLEME_DAKIKA:-15}
      # Uzun işler (analiz, backtest, canlı veri) ayrı 'worker' servisinde çalışır.
      GOREV_GOMULU_ISCI: "false"
      <<: *veri_ortami
    ports:
      - "8000:8000"
    volumes: *ortak_volumeler
    secrets: [cdsapirc]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/saglik').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "turbulans_radar.isci.gorev_iscisi"]
    depends_on:
      # API açılışta şemayı (alembic upgrade head) günceller; işçi ondan sonra başlar.
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      GOREV_ISCI_SAYISI: ${GOREV_ISCI_SAYISI:-2}
      <<: *veri_ortami
    volumes: *ortak_volumeler
    secrets: [cdsapirc]

secrets:
  cdsapirc:
    file: ${CDSAPI_RC_DOSYASI:-/dev/null}

volumes:
  turbulans_pgdata:
  # Aktif ML modeli + model_versiyonlari/ (rollback konteyner yeniden
  # oluşturulunca kaybolmasın; ilk açılışta imajdaki model ile dolar).
  turbulans_modeller:
