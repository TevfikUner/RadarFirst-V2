services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Turbulence-db}
    volumes:
      - turbulans_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env'deki POSTGRES_HOST genelde 'localhost'tur (host makineden
      # doğrudan bağlanmak için) -- konteynerler arasında bu, compose'un
      # servis adı ('db') olmalı. env_file'dan SONRA geldiği için bu değer
      # üstün gelir.
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./ciktilar:/app/ciktilar

volumes:
  turbulans_pgdata:
