# ERA5 arşiv küpleri imaja girmez (.dockerignore: *.nc); ana küp, ek küp klasörü ve
# PIREP arşivi (YEREL_VERI_KOKU altında) /veri'ye SALT OKUNUR bağlanır ve API ile
# işçi AYNI yollardan okur (katalogdaki dosya_yolu iki serviste de geçerli olsun
# diye). Proje kökünün tamamı bağlanmaz: .env, yedekler ve .git konteynerden
# okunamasın. Dosya yoksa (Docker yerine boş klasör açar) o küp atlanır.
x-veri-ortami: &veri_ortami
  HAVA_DURUMU_DOSYASI: /veri/${HAVA_DURUMU_DOSYA_ADI:-ocak_2019_turbulans.nc}
  EK_HAVA_DURUMU_KLASORU: /veri/${EK_HAVA_DURUMU_KLASOR_ADI:-era5_egitim_verisi}
  MODEL_KLASORU: /app/model_deposu
  CDSAPI_RC: /run/secrets/cdsapirc
  ML_PIREP_ARSIV_KLASORU: /veri/${ML_PIREP_ARSIV_KLASOR_ADI:-pirep_ham}

# API/işçi/demo süper kullanıcıyla değil, yalnızca kendi veritabanının sahibi olan
# rolle bağlanır (otomasyon/uygulama_rolu_olustur.sh); UYGULAMA_* yoksa eski davranış.
# env_file tüm .env'yi konteynere taşır: bu servislerin kullanmadığı sırlar boşaltılır
# (environment, env_file'ı ezer). Süper kullanıcı şifresi yalnızca db ve yedek'te kalır.
x-uygulama-db: &uygulama_db
  POSTGRES_HOST: db
  POSTGRES_USER: ${UYGULAMA_POSTGRES_USER:-${POSTGRES_USER:-postgres}}
  POSTGRES_PASSWORD: ${UYGULAMA_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
  UYGULAMA_POSTGRES_PASSWORD: ""
  MCP_POSTGRES_USER: ""
  MCP_POSTGRES_PASSWORD: ""

x-ortak-volumeler: &ortak_volumeler
  - ./ciktilar:/app/ciktilar
  - ./canli_veri:/app/canli_veri
  - ./era5_ucus_verisi:/app/era5_ucus_verisi
  - ./era5_arco_onbellek:/app/era5_arco_onbellek
  - ./opensky_onbellek:/app/opensky_onbellek
  # ML ERA5 pencere deposu (gece işi yazar; bkz. docs/adr/0002-era5-pencere-deposu.md).
  - ./ml_ozellik_deposu:/app/ml_ozellik_deposu
  # MADIS uçak EDR gözlemleri (M1; günlük Parquet, ham dosyalar tutulmaz).
  - ./madis_edr:/app/madis_edr
  # ATS yolu/FRA ağı (AIP'ten elle hazırlanır, depoya konmaz; bkz.
  # docs/veri_hazirlama/ATS_AGI_HAZIRLAMA.md). Yoksa ATS modu 400 döner.
  - ./ats_verisi:/app/ats_verisi:ro
  # Sağlık raporu yedeğin tazeliğini okur (yazmaz).
  - ./db_yedekleri:/app/db_yedekleri:ro
  - ${YEREL_VERI_KOKU:-.}/${HAVA_DURUMU_DOSYA_ADI:-ocak_2019_turbulans.nc}:/veri/${HAVA_DURUMU_DOSYA_ADI:-ocak_2019_turbulans.nc}:ro
  - ${YEREL_VERI_KOKU:-.}/${EK_HAVA_DURUMU_KLASOR_ADI:-era5_egitim_verisi}:/veri/${EK_HAVA_DURUMU_KLASOR_ADI:-era5_egitim_verisi}:ro
  - ${YEREL_VERI_KOKU:-.}/${ML_PIREP_ARSIV_KLASOR_ADI:-pirep_ham}:/veri/${ML_PIREP_ARSIV_KLASOR_ADI:-pirep_ham}:ro
  - ./model_deposu:/app/model_deposu

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Turbulence-db}
    volumes:
      - turbulans_pgdata:/var/lib/postgresql/data
    ports:
      # Sadece bu makineden erişilebilir -- varsayılan şifreyle dış ağa açılmasın.
      - "127.0.0.1:5432:5432"
      # Windows'ta yerel bir PostgreSQL 5432'yi tutuyorsa Windows araçları (MCP
      # sunucusu) Docker veritabanına buradan ulaşır (MCP_POSTGRES_PORT=5433).
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env'deki POSTGRES_HOST genelde 'localhost'tur (host makineden
      # doğrudan bağlanmak için) -- konteynerler arasında bu, compose'un
      # servis adı ('db') olmalı. env_file'dan SONRA geldiği için bu değer
      # üstün gelir (x-uygulama-db).
      # Otonom backend: API, canlı AWC SIGMET'lerini kendi içinde periyodik yeniler.
      SIGMET_OTOMATIK_GUNCELLEME_DAKIKA: ${SIGMET_OTOMATIK_GUNCELLEME_DAKIKA:-15}
      # Canlı GFS küpü bu aralıkla (saat) Türkiye kutusu için önceden hazırlanır; 0 kapatır.
      CANLI_ISITMA_SAAT: ${CANLI_ISITMA_SAAT:-6}
      # ML gece işi (IEM PIREP + CDS eşleştirme + eğitim) her gün bu saatte (UTC;
      # 23:07 = Türkiye 02:07) API tarafından kuyruğa alınır. .env'de boş
      # bırakılırsa (ML_GECE_ISI_SAATI=) kapalıdır; n8n kullanılıyorsa kapatın.
      ML_GECE_ISI_SAATI: ${ML_GECE_ISI_SAATI-23:07}
      # uvicorn süreç sayısı (uvicorn bu değişkeni kendisi okur). >1 verimi artırır;
      # >1 iken DB havuzları VERITABANI_API_BAGLANTI_BUTCESI'ne göre küçülür ve rota
      # önbelleği PostgreSQL'de paylaşılır (docs/PERFORMANS_RAPORU.md §5).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Uzun işler (analiz, backtest, canlı veri) ayrı 'worker' servisinde çalışır.
      GOREV_GOMULU_ISCI: "false"
      # Ağa açılınca (/docs, /openapi.json) kendiliğinden kapanır; bkz. API_BELGELERI_ACIK.
      API_YAYIN_ADRESI: ${API_YAYIN_ADRESI:-127.0.0.1}
      <<: [*veri_ortami, *uygulama_db]
    # Varsayılan yalnızca bu makine; ağdaki bir cihaz (ör. EFB tableti) erişecekse
    # .env'de API_YAYIN_ADRESI=0.0.0.0 (anahtarlar herkese açık ağda düz HTTP'den geçer).
    ports:
      - "${API_YAYIN_ADRESI:-127.0.0.1}:8000:8000"
    volumes: *ortak_volumeler
    secrets: [cdsapirc]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/saglik').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "turbulans_radar.isci.gorev_iscisi"]
    # İşçi çalışan görevi GOREV_DURDURMA_BEKLEME_SANIYE (240) bekler; Docker'ın
    # varsayılan 10 sn'si süren CDS indirmesini SIGKILL ile yarıda kesiyordu.
    stop_grace_period: 300s
    depends_on:
      # API açılışta şemayı (alembic upgrade head) günceller; işçi ondan sonra başlar.
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GOREV_ISCI_SAYISI: ${GOREV_ISCI_SAYISI:-2}
      ISCI_SAGLIK_DOSYASI: /tmp/isci_saglik
      <<: [*veri_ortami, *uygulama_db]
    volumes: *ortak_volumeler
    # Bakım döngüsü (15 sn) veritabanına ulaştıkça dosyayı tazeler; 90 sn tazelenmezse sağlıksız.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/isci_saglik') > 90)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    secrets: [cdsapirc]

  # Günlük veritabanı yedeği: ml_ornekleri/edr_ornekleri haftalarca indirilen
  # veriden üretildi, volume kaybolursa yeniden indirmek aylar sürer. Yedekler
  # ./db_yedekleri'nde (depoya konmaz); geri yükleme README "Veritabanı yedeği".
  yedek:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-Turbulence-db}
      DB_YEDEK_SAKLA_GUN: ${DB_YEDEK_SAKLA_GUN:-7}
      YEDEK_YENIDEN_DENEME_SANIYE: ${YEDEK_YENIDEN_DENEME_SANIYE:-60}
    volumes:
      - ./db_yedekleri:/yedekler
      - ./otomasyon/db_yedekle.sh:/db_yedekle.sh:ro
      - ./ml_ozellik_deposu:/kaynak/ml_ozellik_deposu:ro
      - ./madis_edr:/kaynak/madis_edr:ro
      - ./opensky_onbellek:/kaynak/opensky_onbellek:ro
      - ./model_deposu:/kaynak/model_deposu:ro
    # Disk dışı kopya için docker-compose.override.yml'de /dis_yedek bağlanır
    # (makineye özgü yol, depoya girmez; bkz. README "Veritabanı yedeği").
    # Doluysa disk dışı kopya gpg ile şifrelenir (.env: YEDEK_PAROLA_DOSYASI).
    secrets: [yedek_parolasi]
    entrypoint: ["sh", "/db_yedekle.sh"]

  # Kimlik bilgisi gerektirmeyen demo (bkz. demo/README.md):
  #   cp .env.demo .env && docker compose --profile demo up -d --build
  # API ayağa kalkınca THY322 (2019-01-15) demo paketinden analiz edilip
  # veritabanına yazılır; 3B harita http://localhost:8000/harita/harita3d.html.
  demo:
    build: .
    profiles: ["demo"]
    restart: "no"
    command: ["python", "-m", "turbulans_radar.cli.demo"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *uygulama_db
    volumes:
      - ./ciktilar:/app/ciktilar

secrets:
  cdsapirc:
    file: ${CDSAPI_RC_DOSYASI:-/dev/null}
  yedek_parolasi:
    file: ${YEDEK_PAROLA_DOSYASI:-/dev/null}

volumes:
  turbulans_pgdata:
