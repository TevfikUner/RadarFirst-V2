services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-Turbulence-db}
    volumes:
      - turbulans_pgdata:/var/lib/postgresql/data
    ports:
      # Sadece bu makineden erişilebilir -- varsayılan şifreyle dış ağa açılmasın.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env'deki POSTGRES_HOST genelde 'localhost'tur (host makineden
      # doğrudan bağlanmak için) -- konteynerler arasında bu, compose'un
      # servis adı ('db') olmalı. env_file'dan SONRA geldiği için bu değer
      # üstün gelir.
      POSTGRES_HOST: db
      # Otonom backend: API, canlı AWC SIGMET'lerini kendi içinde periyodik yeniler.
      SIGMET_OTOMATIK_GUNCELLEME_DAKIKA: ${SIGMET_OTOMATIK_GUNCELLEME_DAKIKA:-15}
      # Uzun işler (analiz, backtest, canlı veri) ayrı 'worker' servisinde çalışır.
      GOREV_GOMULU_ISCI: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./ciktilar:/app/ciktilar
      - ./canli_veri:/app/canli_veri
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/saglik').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "turbulans_radar.isci.gorev_iscisi"]
    depends_on:
      # API açılışta şemayı (alembic upgrade head) günceller; işçi ondan sonra başlar.
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      GOREV_ISCI_SAYISI: ${GOREV_ISCI_SAYISI:-2}
    volumes:
      - ./ciktilar:/app/ciktilar
      - ./canli_veri:/app/canli_veri

volumes:
  turbulans_pgdata:
