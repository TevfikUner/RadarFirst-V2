name: Bağımlılık taraması

# pip-audit CI'dan ayrıldı: yeni yayımlanan bir açık ilgisiz her PR'ı kırmasın.
# Haftalık (Pazartesi, Dependabot ile aynı gün) ve kilit dosyası değişince çalışır.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["requirements*"]
  pull_request:
    paths: ["requirements*"]

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: pip-audit kur
        run: pip install pip-audit==2.9.0
      - name: Bağımlılık açığı taraması (pip-audit)
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
          pip-audit -r requirements-era5.lock --no-deps --disable-pip --progress-spinner off
