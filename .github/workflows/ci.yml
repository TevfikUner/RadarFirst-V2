name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff kur
        run: pip install ruff==0.16.8
      - name: Lint (ruff check)
        run: ruff check .
      - name: Biçim kontrolü (ruff format --check)
        run: ruff format --check .

  guvenlik:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAJI: zricethezav/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sır taraması (tüm git geçmişi, .gitleaks.toml + .gitleaksignore)
        run: docker run --rm -v "$PWD":/repo -w /repo "$GITLEAKS_IMAJI" git --redact --no-banner /repo
      # Yapılandırma bozulursa tarama sessizce "temiz" demesin: Türkçe adlı
      # sahte bir sır MUTLAKA yakalanmalı.
      - name: Sahte sır doğrulaması
        run: |
          mkdir -p /tmp/sahte
          printf 'def baglan():\n    sifre = "Gx7kP2qLm9Zr4w"\n' > /tmp/sahte/ornek.py  # gitleaks:allow
          if docker run --rm -v /tmp/sahte:/tara -v "$PWD/.gitleaks.toml":/c.toml "$GITLEAKS_IMAJI" dir --config /c.toml --no-banner /tara; then
            echo "::error::gitleaks sahte sırrı yakalamadı; .gitleaks.toml kurallarını kontrol et."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçları kur
        run: pip install pip-audit==2.9.0 cyclonedx-bom==7.5.0
      - name: Bağımlılık açığı taraması (pip-audit)
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
          pip-audit -r requirements-era5.lock --no-deps --disable-pip --progress-spinner off
      - name: SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.lock --of JSON -o sbom.cdx.json
      - name: SBOM'u artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  test:
    runs-on: ubuntu-latest
    # 3.12 = üretim (Docker) ortamı, hash'li kilit dosyasıyla; 3.14 = yerel
    # geliştirme ortamı. İkisi arasındaki sapma (örn. derlenmiş eklenti ABI
    # uyumsuzluğu) böylece CI'da görünür.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    # Testlerin bir kısmı (test_veritabani.py, test_api_servisi.py) gerçek
    # bir PostgreSQL bağlantısı gerektiriyor -- bağlanamazlarsa otomatik
    # atlanırlar (skip), ama CI'da gerçekten çalıştırılabilmeleri için bir
    # servis konteyneri sağlıyoruz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbulans_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turbulans_ci
      API_ANAHTARI: ci-test-anahtari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bağımlılıkları kur
        run: |
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pip install --require-hashes -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install -r requirements-dev.txt
      - name: Veritabanı şemasını kur (alembic upgrade head)
        run: alembic upgrade head
      - name: Testleri çalıştır (kapsam raporuyla)
        run: pytest tests/ -v --cov --cov-report=term-missing --cov-report=xml
      - name: Kapsam özetini iş özetine yaz
        if: always()
        run: |
          echo "## Test kapsamı" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Kapsam raporunu artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python }}
          path: coverage.xml

  # Playwright + Chromium ile arayüz testleri (harita yükleme, model paneli,
  # rota simülasyonu). Ana test işini yavaşlatmamak için ayrı iş; ekran
  # görüntüleri artifact olarak saklanır.
  tarayici:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbulans_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turbulans_ci
      API_ANAHTARI: ci-test-anahtari
      TARAYICI_EKRAN_KLASORU: ekran_goruntuleri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt -r requirements-tarayici.txt
      - name: Chromium kur
        run: python -m playwright install --with-deps chromium
      - name: Web kütüphanelerini yerelden sun (CesiumJS, MapLibre; sha512 doğrulamalı)
        run: python -m turbulans_radar.cli.statik_indir
        env:
          PYTHONPATH: src
      - name: Veritabanı şemasını kur
        run: alembic upgrade head
      - name: Arayüz testleri (atlanan test başarısızlık sayılır)
        shell: bash
        run: |
          pytest -m tarayici -v -rs | tee tarayici.log
          if grep -q "SKIPPED" tarayici.log; then
            echo "::error::Arayüz testlerinden biri atlandı; CI'da hepsi çalışmalı."
            exit 1
          fi
      - name: Ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arayuz-ekran-goruntuleri
          path: ekran_goruntuleri/
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker imajını derle
        run: docker build -t turbulans-radar:ci .
      # Sadece derlemek compose'daki volume/ortam/bağımlılık hatalarını
      # yakalamaz: yığın gerçekten ayağa kaldırılıp uçtan uca denenir.
      - name: Compose yığınını başlat
        run: |
          cat > .env <<'ORTAM'
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-duman-sifresi
          POSTGRES_DB=turbulans_ci
          API_ANAHTARI=ci-duman-yonetici
          API_PILOT_ANAHTARI=ci-duman-pilot
          ML_GECE_ISI_SAATI=
          ORTAM
          docker compose up -d --build --wait --wait-timeout 300
      - name: Duman testi
        run: bash .github/duman_testi.sh
      - name: Hata olursa konteyner logları
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Yığını kapat
        if: always()
        run: docker compose down -v
      - name: İmaj içinde API uygulamasını yükle (duman testi)
        run: docker run --rm turbulans-radar:ci python -c "from turbulans_radar.api.api_servisi import app; print(len(app.routes), 'rota')"
