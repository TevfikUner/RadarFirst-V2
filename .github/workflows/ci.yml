name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff kur
        run: pip install ruff
      - name: Lint (ruff check)
        run: ruff check .
      - name: Biçim kontrolü (ruff format --check)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # Testlerin bir kısmı (test_veritabani.py, test_api_servisi.py) gerçek
    # bir PostgreSQL bağlantısı gerektiriyor -- bağlanamazlarsa otomatik
    # atlanırlar (skip), ama CI'da gerçekten çalıştırılabilmeleri için bir
    # servis konteyneri sağlıyoruz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: turbulans_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turbulans_ci
      API_ANAHTARI: ci-test-anahtari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Veritabanı şemasını kur (alembic upgrade head)
        run: alembic upgrade head
      - name: Testleri çalıştır
        run: pytest tests/ -v
