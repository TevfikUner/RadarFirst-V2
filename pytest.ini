[pytest]
; Proje kokunu sys.path'e ekler -- tests/'in altinda __init__.py olmadigi
; icin pytest, testleri "config", "veritabani" gibi kok dizindeki modulleri
; import edecek sekilde degil, sadece tests/ klasorunu sys.path'e ekleyerek
; topluyor. `python -m pytest` CWD'yi otomatik ekledigi icin yerelde bu fark
; gizli kalabiliyor; duz `pytest` komutuyla (CI'nin kullandigi) veya baska
; bir dizinden calistirildiginda "ModuleNotFoundError: No module named
; 'config'" ile patlar. Bu satir olmadan CI'de tam olarak bu hata olustu.
pythonpath = src
asyncio_mode = auto
; Tum async testler/fixture'lar TEK bir event loop paylasir -- gercek bir
; uvicorn surecinin (tek event loop) davranisini taklit eder. Aksi halde
; her test kendi event loop'unu acar/kapatir ve veritabani.py'deki asyncpg
; engine singleton'i (production'da dogru olan bu tasarim) loop'lar arasi
; paylasilinca "Event loop is closed" hatasi verir.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = --strict-markers -m "not ag"
markers =
    birim: dis bagimliligi olmayan test (conftest otomatik isaretler)
    veritabani: gercek PostgreSQL gerektirir
    gercek_veri: gercek ERA5 kupu / egitilmis model / PIREP verisi gerektirir
    tarayici: Playwright + canli API sunucusu gerektirir
    ag: gercek dis servise (CDS vb.) istek atar; varsayilan calistirmada haric, `pytest -m ag` ile
; xarray'in netCDF4 arka ucu NumPy 2.5'te kullanimdan kalkan dizi sekli atamasini kullaniyor (bizim kodumuz degil).
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:xarray.*
