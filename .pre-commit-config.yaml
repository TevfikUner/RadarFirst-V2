repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]

  # Sır taraması: .gitleaks.toml varsayılan kurallara Türkçe adlı değişkenleri
  # (sifre, parola, api_anahtari...) ekler. Yanlış pozitif satıra
  # `# gitleaks:allow` yazılır; gerçek sır koddan çıkarılıp değiştirilir.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
